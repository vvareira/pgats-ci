# CI de nível 02 - Execução Agendada

#nome da pipeline
name: 'Execução Agendada'

#gatilhos/triggers - regras de disparo
#gatilho manual = workflow dispatch

on:
  schedule: 
    - cron: '0 0 * * 0'


#definicao de tarefas dentro da pipeline
jobs: 
  #nome do job
  e2e-tests: 
      #maquina onde o job vai rodar
      runs-on: ubuntu-latest

      #passos do job
      steps:
          # clone do projeto
          - uses: actions/checkout@v4

          #instalação do node
          - uses: actions/setup-node@v4
            with: 
              node-version: 24.x

          # instalacao do yarn
          - name: instalacao Yarn
            run: npm install -g yarn

          # instalação das dependencias
          - name: instalacao dependencias
            run: yarn install

          # instalação dos browsers do playwrite
          - name: instalacao dos browsers do playwrite
            run:  yarn playwright install

          # execucao dos testes
          - name: execucao dos testes
            run:  yarn run e2e

          # Exercício 2 Actions Status Discord
          - uses: sarisia/actions-status-discord@v1
            if: always()
            with:
              webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
                        
              
