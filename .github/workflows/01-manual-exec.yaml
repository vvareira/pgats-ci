# CI de nível 01 - Disparo através de clique

#nome da pipeline
name: 'Execução Manual'

#gatilhos/triggers - regras de disparo
#gatilho manual = workflow dispatch

on:
  workflow_dispatch: 


#definicao de tarefas dentro da pipeline
jobs: 
  #nome do job
  e2e-tests: 
      #maquina onde o job vai rodar
      runs-on: ubuntu-latest

      #passos do job
      steps:
          # clone do projeto
          - uses: actions/checkout@v4

          #instalação do node
          - uses: actions/setup-node@v4
            with: 
              node-version: 24.x

          # instalacao do yarn
          - name: instalacao Yarn
            run: npm install -g yarn

          # instalação das dependencias
          - name: instalacao dependencias
            run: yarn install

          # instalação dos browsers do playwrite
          - name: instalacao dos browsers do playwrite
            run:  yarn playwright install

          # execucao dos testes
          - name: execucao dos testes
            run:  yarn run e2e

          ##Exercício 2 Action Notify Discord
          - name: Notificar Discord
            uses: th0th/notify-discord@v0.4.1
            if: ${{ always() }}  
            env:
              DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
              GITHUB_ACTOR: ${{ github.actor }}
              GITHUB_JOB_NAME: "Build and deploy"
              GITHUB_JOB_STATUS: ${{ job.status }}


